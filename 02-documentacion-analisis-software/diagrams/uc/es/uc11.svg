<svg viewBox="0 0 760 378" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#2a2a2a"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="378" fill="#0b0b0b"/>
  <rect x="0" y="0" width="760" height="378" fill="url(#grid)"/>

  <!-- system boundary -->
  <rect x="230" y="40" width="480" height="288" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="230" y1="74" x2="710" y2="74" stroke="#ffffff" stroke-width="1"/>
  <text x="470" y="61" fill="#ffffff" font-size="13" text-anchor="middle"><tspan x="470" dy="0">Ver mis notificaciones</tspan></text>
  <text x="698" y="92" fill="#bfbfbf" font-size="11" text-anchor="end" font-style="italic">sistema</text>

  <line x1="94" y1="184" x2="320" y2="144" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="470" y1="179" x2="470" y2="226" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  
    <ellipse cx="470" cy="144" rx="150" ry="35" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="470" y="148" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="470" dy="-7">Ver notificaciones</tspan><tspan x="470" dy="15">de reservas y pagos</tspan></text>
  
    <ellipse cx="470" cy="272" rx="150" ry="46" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="470" y="276" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="470" dy="-14">Marcar una</tspan><tspan x="470" dy="15">notificación como</tspan><tspan x="470" dy="15">leída</tspan></text>

  <!-- actor -->
  
    <circle cx="80" cy="156" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="166" x2="80" y2="198" stroke="#ffffff" stroke-width="2"/>
    <line x1="66" y1="180" x2="94" y2="180" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="198" x2="68" y2="218" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="198" x2="92" y2="218" stroke="#ffffff" stroke-width="2"/>
  <text x="80" y="236" fill="#ffffff" font-size="12" text-anchor="middle">Cliente</text>
</svg>