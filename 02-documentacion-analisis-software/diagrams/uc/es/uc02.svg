<svg viewBox="0 0 760 506" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#2a2a2a"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="506" fill="#0b0b0b"/>
  <rect x="0" y="0" width="760" height="506" fill="url(#grid)"/>

  <!-- system boundary -->
  <rect x="230" y="40" width="480" height="416" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="230" y1="74" x2="710" y2="74" stroke="#ffffff" stroke-width="1"/>
  <text x="470" y="61" fill="#ffffff" font-size="13" text-anchor="middle"><tspan x="470" dy="0">Registrarse</tspan></text>
  <text x="698" y="92" fill="#bfbfbf" font-size="11" text-anchor="end" font-style="italic">sistema</text>

  <line x1="94" y1="248" x2="320" y2="144" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="470" y1="201" x2="470" y2="226" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="470" y1="318" x2="470" y2="365" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  
    <ellipse cx="470" cy="144" rx="150" ry="57" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="470" y="148" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="470" dy="-21">Completar nombre,</tspan><tspan x="470" dy="15">apellido, email,</tspan><tspan x="470" dy="15">username y</tspan><tspan x="470" dy="15">contraseña</tspan></text>
  
    <ellipse cx="470" cy="272" rx="150" ry="46" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="470" y="276" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="470" dy="-14">Validar que el email</tspan><tspan x="470" dy="15">y el username sean</tspan><tspan x="470" dy="15">únicos</tspan></text>
  
    <ellipse cx="470" cy="400" rx="150" ry="35" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="470" y="404" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="470" dy="-7">Crear la cuenta con</tspan><tspan x="470" dy="15">rol Cliente</tspan></text>

  <!-- actor -->
  
    <circle cx="80" cy="220" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="230" x2="80" y2="262" stroke="#ffffff" stroke-width="2"/>
    <line x1="66" y1="244" x2="94" y2="244" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="262" x2="68" y2="282" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="262" x2="92" y2="282" stroke="#ffffff" stroke-width="2"/>
  <text x="80" y="300" fill="#ffffff" font-size="12" text-anchor="middle">Visitante</text>
</svg>