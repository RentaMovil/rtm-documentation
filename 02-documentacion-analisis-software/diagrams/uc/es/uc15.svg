<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#2a2a2a"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#0b0b0b"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#grid)"/>

  <!-- system boundary -->
  <rect x="190" y="40" width="420" height="280" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="190" y1="74" x2="610" y2="74" stroke="#ffffff" stroke-width="1"/>
  <text x="400" y="61" fill="#ffffff" font-size="13" text-anchor="middle"><tspan x="400" dy="0">Registrar recogida y devolución</tspan></text>
  <text x="598" y="92" fill="#bfbfbf" font-size="11" text-anchor="end" font-style="italic">sistema</text>

  <!-- use case oval -->
  <ellipse cx="400" cy="197" rx="120" ry="37" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="400" y="201" fill="#ffffff" font-size="13" text-anchor="middle"><tspan x="400" dy="-7">Registrar recogida y</tspan><tspan x="400" dy="15">devolución</tspan></text>

  <!-- actor -->
  
    <circle cx="75" cy="152" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="75" y1="162" x2="75" y2="194" stroke="#ffffff" stroke-width="2"/>
    <line x1="61" y1="176" x2="89" y2="176" stroke="#ffffff" stroke-width="2"/>
    <line x1="75" y1="194" x2="63" y2="214" stroke="#ffffff" stroke-width="2"/>
    <line x1="75" y1="194" x2="87" y2="214" stroke="#ffffff" stroke-width="2"/>
  <text x="75" y="232" fill="#ffffff" font-size="12" text-anchor="middle">Administrador</text>

  <!-- connector -->
  <line x1="89" y1="180" x2="280" y2="197" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>