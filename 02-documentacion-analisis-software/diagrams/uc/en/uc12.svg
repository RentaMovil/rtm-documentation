<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#2a2a2a"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="520" fill="#0b0b0b"/>
  <rect x="0" y="0" width="820" height="520" fill="url(#grid)"/>

  <!-- system boundary -->
  <rect x="260" y="40" width="500" height="430" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="260" y1="74" x2="760" y2="74" stroke="#ffffff" stroke-width="1"/>
  <text x="510" y="61" fill="#ffffff" font-size="13" text-anchor="middle"><tspan x="510" dy="0">Manage vehicles</tspan></text>
  <text x="748" y="92" fill="#bfbfbf" font-size="11" text-anchor="end" font-style="italic">system</text>

  <line x1="94" y1="272" x2="285" y2="272" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="442.1967592356056" y1="241.63097644473856" x2="554.4357898201588" y2="176.32826774099854" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="494.0371676446514" y1="267.27103783433404" x2="467.5045267763313" y2="268.4770669647122" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="448.9838717006706" y1="300.95571883487463" x2="563.6734516653388" y2="357.2578762720754" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>
  
    <ellipse cx="390" cy="272" rx="105" ry="35" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="390" y="276" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="390" dy="-7">Log into the</tspan><tspan x="390" dy="15">system</tspan></text>
  
    <ellipse cx="610" cy="144" rx="145" ry="35" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="610" y="148" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="610" dy="-7">Register new</tspan><tspan x="610" dy="15">vehicles</tspan></text>
  
    <ellipse cx="610" cy="262" rx="145" ry="35" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="610" y="266" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="610" dy="-7">Edit existing</tspan><tspan x="610" dy="15">vehicles</tspan></text>
  
    <ellipse cx="610" cy="380" rx="145" ry="24" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="610" y="384" fill="#ffffff" font-size="12.5" text-anchor="middle"><tspan x="610" dy="0">Retire a vehicle</tspan></text>

  <!-- actor -->
  
    <circle cx="80" cy="244" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="254" x2="80" y2="286" stroke="#ffffff" stroke-width="2"/>
    <line x1="66" y1="268" x2="94" y2="268" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="286" x2="68" y2="306" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="286" x2="92" y2="306" stroke="#ffffff" stroke-width="2"/>
  <text x="80" y="324" fill="#ffffff" font-size="12" text-anchor="middle">Administrator</text>
</svg>